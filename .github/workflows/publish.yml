# Publishes bottles and merges a pull request automatically once its brew test-bot run passes.
name: brew pr-pull

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: brew-pr-pull
  cancel-in-progress: false

jobs:
  pr-pull:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Find pull request
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_PR: ${{ inputs.pull_request }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          then
            echo "number=$MANUAL_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefOid,isDraft \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" and .isDraft == false) | .number")
          if [[ -z "$number" ]]
          then
            echo "No open, non-draft pull request for $HEAD_SHA; nothing to publish."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        if: steps.find_pr.outputs.number != ''
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        if: steps.find_pr.outputs.number != ''
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Pull bottles
        if: steps.find_pr.outputs.number != ''
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ steps.find_pr.outputs.number }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Generate build provenance
        if: steps.find_pr.outputs.number != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        if: steps.find_pr.outputs.number != ''
        uses: Homebrew/actions/git-try-push@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          branch: main
